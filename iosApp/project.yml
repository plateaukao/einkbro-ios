name: iosApp
options:
  bundleIdPrefix: info.plateaukao
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    # Managed entitlements (granted per-team by Apple):
    #
    # - com.apple.developer.web-browser (default browser): GRANTED 2026-09-01
    #   for info.plateaukao.einkbro.ios, after the shipping binary declared
    #   http/https in CFBundleURLTypes (Apple validates the released build's
    #   Info.plist mechanically — see the comment there). With it, EinkBro is
    #   offered in Settings > Apps > Default Apps > Browser. Receiving side:
    #   iOSApp.swift onOpenURL -> handleExternalUrl -> ExternalUrlBridge.
    #
    # - com.apple.developer.networking.multicast: NOT granted yet. LAN
    #   link/app-data share uses raw UDP multicast (Android-compatible
    #   protocol); request at
    #   developer.apple.com/contact/request/networking-multicast. Adding it
    #   before the grant fails provisioning. Once granted, add
    #   "com.apple.developer.networking.multicast: true" to properties below
    #   (xcodegen regenerates EinkBro.entitlements from properties).
    entitlements:
      path: iosApp/EinkBro.entitlements
      properties:
        com.apple.developer.web-browser: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.plateaukao.einkbro.ios
        PRODUCT_NAME: EinkBro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
        # Same signing setup as ~/src/nerlan: the user's team, automatic style.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3WD42GF27D
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
