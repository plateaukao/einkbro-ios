name: iosApp
options:
  bundleIdPrefix: info.plateaukao
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    # LAN link/app-data share uses raw UDP multicast (Android-compatible
    # protocol); iOS requires the restricted multicast entitlement for it.
    # Apple must first grant "Multicast Networking" to team 3WD42GF27D for
    # this bundle id (request at developer.apple.com/contact/request/networking-multicast);
    # until then including it fails provisioning. Once granted, restore:
    #   entitlements:
    #     path: iosApp/EinkBro.entitlements
    #     properties:
    #       com.apple.developer.networking.multicast: true
    #
    # Default-browser support is blocked the same way. Being offered in
    # Settings > Apps > Default Apps > Browser needs
    # com.apple.developer.web-browser, a MANAGED entitlement Apple grants only
    # on request. Request it via the web form (Account Holder must be signed in):
    # developer.apple.com/contact/request/default-browser-entitlement
    # (reported waits run weeks). Two things change once it is granted, so this
    # cannot be a drop-in edit:
    #   - managed entitlements require MANUAL signing, so CODE_SIGN_STYLE below
    #     must move off Automatic and a matching profile must be installed;
    #   - Info.plist likely also needs http/https listed in CFBundleURLTypes
    #     (confirm against Apple's "Preparing your app to be the default web
    #     browser" doc at grant time — it is inert without the entitlement).
    # The receiving side is already implemented: iOSApp.swift's onOpenURL hands
    # every incoming URL to handleExternalUrl, and ExternalUrlBridge.normalize
    # passes non-einkbro:// URLs through unchanged, so http(s) hand-offs already
    # open in a tab. Adding the entitlement before Apple grants it fails
    # provisioning. Once granted, add to the entitlements block above:
    #       com.apple.developer.web-browser: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.plateaukao.einkbro.ios
        PRODUCT_NAME: EinkBro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
        # Same signing setup as ~/src/nerlan: the user's team, automatic style.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3WD42GF27D
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
