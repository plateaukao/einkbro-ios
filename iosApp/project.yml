name: iosApp
options:
  bundleIdPrefix: info.plateaukao
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    # LAN link/app-data share uses raw UDP multicast (Android-compatible
    # protocol); iOS requires the restricted multicast entitlement for it.
    # Apple must first grant "Multicast Networking" to team 3WD42GF27D for
    # this bundle id (request at developer.apple.com/contact/request/networking-multicast);
    # until then including it fails provisioning. Once granted, restore:
    #   entitlements:
    #     path: iosApp/EinkBro.entitlements
    #     properties:
    #       com.apple.developer.networking.multicast: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.plateaukao.einkbro.ios
        PRODUCT_NAME: EinkBro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
        # Same signing setup as ~/src/nerlan: the user's team, automatic style.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3WD42GF27D
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
